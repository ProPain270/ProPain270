name: Publication review
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On pull_request events, inspect the PR head rather than GitHub's
          # synthetic merge commit, whose author fails the identity check.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/test_public_export.py
      - run: python3 tools/check_public_export.py
